spring:
  application:
    name: guftagu-backend
  datasource:
    url: ${GUFTAGU_DATABASE_URL:jdbc:postgresql://localhost:5432/guftagu_dev}
    username: ${GUFTAGU_DATABASE_USERNAME:guftagu_user}
    password: ${GUFTAGU_DATABASE_PASSWORD:guftagu_dev_password}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  shutdown: graceful

guftagu:
  security:
    jwt:
      secret: ${GUFTAGU_JWT_SECRET:guftagu-development-secret-key-must-be-at-least-256-bits-long-for-hmac-sha}
      issuer: guftagu
      access-token-ttl: 10m
