name: backend-ci

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'contracts/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'contracts/**'
      - '.github/workflows/backend-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-and-test:
    name: Backend Build & Test (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Ensure Maven wrapper is executable
        run: chmod +x backend/mvnw

      - name: Run unit tests
        run: ./backend/mvnw -B clean test -f backend/pom.xml

      - name: Run integration tests
        run: ./backend/mvnw -B verify -Pintegration-tests -f backend/pom.xml
